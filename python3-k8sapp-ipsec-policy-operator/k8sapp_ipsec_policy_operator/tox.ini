[tox]
# NOTE: Trixie environments (py313, flake8-trixie, pylint-trixie, coverage-trixie,
# security-trixie) are intentionally excluded from envlist. They are only triggered
# via Zuul CI jobs on debian-trixie nodes and should not run in local 'tox' invocations
# which target the Bullseye/py39 baseline.
envlist = flake8,py39,pylint,metadata,bandit,coverage,security,coverage-go
minversion = 1.6
skipsdist = True

# tox does not work if the path to the workdir is too long, so move it to /tmp
# tox 3.1.0 adds TOX_LIMITED_SHEBANG
toxworkdir = /tmp/{env:USER:zuul}_k8sipsecpolicyoperatormgrtox
stxdir = {toxinidir}/../../..
distshare={toxworkdir}/.tox/distshare

[testenv]
basepython = python3.9
usedevelop = True

# tox is silly... these need to be separated by a newline....
allowlist_externals = bash
                      find
                      echo

install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}

# Note the hash seed is set to 0 until can be tested with a
# random hash seed successfully.
setenv = VIRTUAL_ENV={envdir}
         PYTHONHASHSEED=0
         PIP_RESOLVER_DEBUG=1
         PYTHONDONTWRITEBYTECODE=1
         OS_TEST_PATH=./k8sapp_ipsec_policy_operator/tests
         LANG=en_US.UTF-8
         LANGUAGE=en_US:en
         LC_ALL=C
         EVENTS_YAML=./k8sapp_ipsec_policy_operator/tests/events_for_testing.yaml
         SYSINV_TEST_ENV=True
         TOX_WORK_DIR={toxworkdir}
         PYLINTHOME={toxworkdir}

deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
       -e{[tox]stxdir}/config/sysinv/sysinv/sysinv
       -e{[tox]stxdir}/config/tsconfig/tsconfig
       -e{[tox]stxdir}/fault/fm-api/source
       -e{[tox]stxdir}/fault/python-fmclient/fmclient
       -e{[tox]stxdir}/utilities/ceph/python-cephclient/python-cephclient

commands =
  find . -type f -name "*.pyc" -delete

[flake8]
# H series are hacking
# H101 is TODO
# H102 is apache license
# H104 file contains only comments (ie: license)
# H105 author tags
# H216 The unittest.mock module should be used rather than the third party mock package
#      (enabled by hacking>=6.1.0 with py313; our test code uses unittest.mock but
#       hacking still flags some transitive imports)
# H306 imports not in alphabetical order
# H401 docstring should not start with a space
# H403 multi line docstrings should end on a new line
# H404 multi line docstring should start without a leading new line
# H405 multi line docstring summary not separated with an empty line
# H701 Empty localization string
# H702 Formatting operation should be outside of localization method call
# H703 Multiple positional placeholders

# B series are bugbear
# B006 Do not use mutable data structures for argument defaults. Needs to be FIXED.
# B007 Loop control variable not used within the loop body.
# B009 Do not call getattr with a constant attribute value
# B010 Do not call setattr with a constant attribute value
# B012 return/continue/break inside finally blocks cause exceptions to be silenced
# B014 Redundant exception types
# B301 Python 3 does not include `.iter*` methods on dictionaries. (this should be suppressed on a per line basis)

# W series are warnings
# W503 line break before binary operator
# W504 line break after binary operator
# W605 invalid escape sequence

# E series are pep8
# E117 over-indented
# E126 continuation line over-indented for hanging indent
# E127 continuation line over-indented for visual indent
# E128 continuation line under-indented for visual indent
# E402 module level import not at top of file
# E741 ambiguous variable name

ignore = H101,H102,H104,H105,H216,H306,H401,H403,H404,H405,H701,H702,H703,
         B006,B007,B009,B010,B012,B014,B301
         W503,W504,W605,
         E117,E126,E127,E128,E402,E741
exclude = build,dist,tools,.eggs
max-line-length=120

[testenv:flake8]
deps = -r{toxinidir}/test-requirements.txt
commands =
  flake8 {posargs} ./k8sapp_ipsec_policy_operator

[testenv:py39]
commands =
  stestr run {posargs}
  stestr slowest

[testenv:pep8]
# testenv:flake8 clone
deps = -r{toxinidir}/test-requirements.txt
commands = {[testenv:flake8]commands}

[testenv:venv]
commands = {posargs}

[bandit]
# The following bandit tests are being skipped:
# B101: Test for use of assert
# B103: Test for setting permissive file permissions
# B104: Test for binding to all interfaces
# B105: Test for use of hard-coded password strings
# B108: Test for insecure usage of tmp file/directory
# B110: Try, Except, Pass detected.
# B303: Use of insecure MD2, MD4, MD5, or SHA1 hash function.
# B307: Blacklisted call to eval.
# B310: Audit url open for permitted schemes
# B311: Standard pseudo-random generators are not suitable for security/cryptographic purposes
# B314: Blacklisted calls to xml.etree.ElementTree
# B318: Blacklisted calls to xml.dom.minidom
# B320: Blacklisted calls to lxml.etree
# B404: Import of subprocess module
# B405: import xml.etree
# B408: import xml.minidom
# B410: import lxml
# B506: Test for use of yaml load
# B602: Test for use of popen with shell equals true
# B603: Test for use of subprocess without shell equals true
# B604: Test for any function with shell equals true
# B605: Test for starting a process with a shell
# B607: Test for starting a process with a partial path
# B608: Possible SQL injection vector through string-based query
#
# Note: 'skips' entry cannot be split across multiple lines
#
skips = B101,B103,B104,B105,B108,B110,B303,B307,B310,B311,B314,B318,B320,B404,B405,B408,B410,B506,B602,B603,B604,B605,B607,B608
exclude = tests

[testenv:bandit]
deps = -r{toxinidir}/test-requirements.txt
commands = bandit --ini tox.ini -n 5 -r k8sapp_ipsec_policy_operator

[testenv:pylint]
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
commands =
     pylint {posargs} k8sapp_ipsec_policy_operator --rcfile=./pylint.rc

# NOTE: [testenv:cover] is a legacy environment kept for backward compatibility.
# The [testenv:coverage] environment below is the actively used variant.
[testenv:cover]
# not sure is passenv is still needed
passenv = CURL_CA_BUNDLE
deps = {[testenv]deps}
setenv = {[testenv]setenv}
         PYTHON=coverage run --parallel-mode

commands =
  {[testenv]commands}
   coverage erase
   stestr run {posargs}
   coverage combine
   coverage html -d cover
   coverage xml -o cover/coverage.xml
   coverage report

[testenv:pip-missing-reqs]
# do not install test-requirements as that will pollute the virtualenv for
# determining missing packages
# this also means that pip-missing-reqs must be installed separately, outside
# of the requirements.txt files
deps = pip_missing_reqs
       -rrequirements.txt
commands=pip-missing-reqs -d --ignore-file=/k8sapp_ipsec_policy_operator/tests k8sapp_ipsec_policy_operator

[testenv:metadata]
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
# Pass top level app folder to 'sysinv-app tox' command.
commands =
  bash -c "echo $(dirname $(dirname $(pwd))) | xargs -n 1 sysinv-app tox"

[testenv:coverage]
basepython = python3.9
usedevelop = False
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         PYTHONHASHSEED=0
         PYTHONDONTWRITEBYTECODE=1
allowlist_externals = bash
                      find
                      mkdir
deps = coverage>=3.6
       mock>=2.0.0
       stestr>=1.0.0
       testtools>=0.9.36
       fixtures>=3.0.0
       python-subunit>=0.0.18
       oslotest>=3.2.0
       oslo.log
       oslo.utils
       pbr>=2.0.0
       pytest
commands =
  find . -type f -name "*.pyc" -delete
  mkdir -p UTCoverage
  bash -c "cd {toxinidir} && \
    coverage erase && \
    coverage run --source=k8sapp_ipsec_policy_operator/common,k8sapp_ipsec_policy_operator/helm,k8sapp_ipsec_policy_operator/lifecycle \
      --omit='*tests*,*test_*' \
      -m pytest --import-mode=importlib \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_constants.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_helm.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle_extended.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle_actions.py \
      2>&1 | tee UTCoverage/test_output.txt; \
    coverage report --fail-under=85 2>&1 | tee UTCoverage/coverage_report.txt; \
    coverage html -d UTCoverage/htmlcov; \
    coverage xml -o UTCoverage/coverage.xml; \
    echo 'Coverage analysis complete'"

[testenv:security]
basepython = python3.9
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
deps = bandit
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p UTCoverage
  bash -c "bandit --ini tox.ini -n 5 -r k8sapp_ipsec_policy_operator -f txt 2>&1 | tee UTCoverage/security_report.txt; \
    bandit --ini tox.ini -n 5 -r k8sapp_ipsec_policy_operator -f json -o UTCoverage/bandit-report.json || true"

[testenv:coverage-go]
basepython = python3.9
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
deps =
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p UTCoverage
  bash -c "if command -v go >/dev/null 2>&1; then \
    echo '=== Go coverage: ipsec-policy-manager-operator ===' | tee UTCoverage/coverage_go_report.txt; \
    cd {toxinidir}/../../ipsec-policy-manager-operator && go test -coverprofile=coverage.out \
      ./api/v1/ ./pkg/utility/ ./pkg/swanctl/ ./pkg/kubernetes/ ./test/utils/ \
      2>&1 | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt; \
    go tool cover -func=coverage.out 2>&1 | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt; \
    echo '=== Go coverage: ipsec-policy-agent-operator ===' | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt; \
    cd {toxinidir}/../../ipsec-policy-agent-operator && go test -coverprofile=coverage.out \
      ./pkg/swanctl/ ./test/utils/ \
      2>&1 | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt; \
    go tool cover -func=coverage.out 2>&1 | tee -a {toxinidir}/UTCoverage/coverage_go_report.txt; \
  else \
    echo 'SKIPPED: Go toolchain not installed' | tee UTCoverage/coverage-go_skipped.txt; \
  fi"

[testenv:py313]
basepython = python3.13
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements-trixie.txt
       -e{[tox]stxdir}/config/sysinv/sysinv/sysinv
       -e{[tox]stxdir}/config/tsconfig/tsconfig
       -e{[tox]stxdir}/fault/fm-api/source
       -e{[tox]stxdir}/fault/python-fmclient/fmclient
       -e{[tox]stxdir}/utilities/ceph/python-cephclient/python-cephclient
commands =
  stestr run {posargs}
  stestr slowest

[testenv:flake8-trixie]
basepython = python3.13
description = Run flake8 (Trixie/py313)
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
deps = -r{toxinidir}/test-requirements-trixie.txt
commands =
  flake8 {posargs} ./k8sapp_ipsec_policy_operator

[testenv:pylint-trixie]
basepython = python3.13
description = Pylint check (Trixie/py313)
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements-trixie.txt
       -e{[tox]stxdir}/config/sysinv/sysinv/sysinv
       -e{[tox]stxdir}/config/tsconfig/tsconfig
       -e{[tox]stxdir}/fault/fm-api/source
       -e{[tox]stxdir}/fault/python-fmclient/fmclient
       -e{[tox]stxdir}/utilities/ceph/python-cephclient/python-cephclient
commands =
     pylint {posargs} k8sapp_ipsec_policy_operator --rcfile=./pylint.rc

[testenv:coverage-trixie]
basepython = python3.13
usedevelop = False
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
    {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         PYTHONHASHSEED=0
         PYTHONDONTWRITEBYTECODE=1
allowlist_externals = bash
                      find
                      mkdir
deps = coverage>=3.6
       mock>=2.0.0
       stestr>=1.0.0
       testtools>=0.9.36
       fixtures>=3.0.0
       python-subunit>=0.0.18
       oslotest>=3.2.0
       oslo.log
       oslo.utils
       pbr>=2.0.0
       pytest
commands =
  find . -type f -name "*.pyc" -delete
  mkdir -p UTCoverage
  bash -c "cd {toxinidir} && \
    coverage erase && \
    coverage run --source=k8sapp_ipsec_policy_operator/common,k8sapp_ipsec_policy_operator/helm,k8sapp_ipsec_policy_operator/lifecycle \
      --omit='*tests*,*test_*' \
      -m pytest --import-mode=importlib \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_constants.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_helm.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle_extended.py \
      k8sapp_ipsec_policy_operator/tests_coverage/test_ipsec_lifecycle_actions.py \
      2>&1 | tee UTCoverage/test_output.txt; \
    coverage report --fail-under=85 2>&1 | tee UTCoverage/coverage_report.txt; \
    coverage html -d UTCoverage/htmlcov; \
    coverage xml -o UTCoverage/coverage.xml; \
    echo 'Coverage analysis complete'"

[testenv:security-trixie]
basepython = python3.13
install_command = pip install -v -v -v \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
    {opts} {packages}
deps = bandit
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p UTCoverage
  # NOTE: '|| true' ensures bandit findings do not fail the build.
  # Bandit reports are captured as artifacts for review; the CI job validates
  # that bandit runs successfully, not that zero findings exist.
  bash -c "bandit --ini tox.ini -n 5 -r k8sapp_ipsec_policy_operator -f txt 2>&1 | tee UTCoverage/security_report.txt; \
    bandit --ini tox.ini -n 5 -r k8sapp_ipsec_policy_operator -f json -o UTCoverage/bandit-report.json || true"
