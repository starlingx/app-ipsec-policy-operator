- hosts: all
  tasks:
    - name: Find security report
      stat:
        path: "{{ zuul.project.src_dir }}/python3-k8sapp-ipsec-policy-operator/k8sapp_ipsec_policy_operator/UTCoverage/security_report.txt"
      register: security_report

    - name: Upload security report
      synchronize:
        src: "{{ zuul.project.src_dir }}/python3-k8sapp-ipsec-policy-operator/k8sapp_ipsec_policy_operator/UTCoverage/security_report.txt"
        dest: "{{ zuul.executor.log_root }}/security_report.txt"
        mode: pull
      when: security_report.stat.exists
      failed_when: false

    - name: Upload bandit JSON report
      synchronize:
        src: "{{ zuul.project.src_dir }}/python3-k8sapp-ipsec-policy-operator/k8sapp_ipsec_policy_operator/UTCoverage/bandit-report.json"
        dest: "{{ zuul.executor.log_root }}/bandit-report.json"
        mode: pull
      failed_when: false
